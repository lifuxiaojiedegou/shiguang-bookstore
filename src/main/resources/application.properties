spring.application.name=online-shop
spring.config.import=optional:file:./config/application-local.properties
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:465}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
shop.mail.mode=${MAIL_MODE:file}
shop.mail.directory=${MAIL_DIRECTORY:./data/mail}
shop.mail.from=${SMTP_FROM:campus-shop@example.com}
