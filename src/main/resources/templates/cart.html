<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>购物车 · 拾光书店</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<header class="masthead">
    <div class="masthead-inner">
        <a class="brand" th:href="@{/}">
            <span class="brand-seal" aria-hidden="true">书</span>
            <span class="brand-text">拾光书店</span>
        </a>
        <div class="masthead-meta">
            <p class="brand-note">校园图书目录</p>
            <div class="account" sec:authorize="isAuthenticated()">
                <a th:href="@{/cart}">购物车</a>
                <a th:href="@{/orders}">我的订单</a>
                <span sec:authentication="name">用户</span>
                <form th:action="@{/logout}" method="post">
                    <button type="submit">退出</button>
                </form>
            </div>
        </div>
    </div>
</header>

<main class="page-shell">
    <h1 class="page-title">购物车</h1>

    <p class="form-success" th:if="${message}" th:text="${message}">提示</p>
    <p class="form-error" th:if="${error}" th:text="${error}">错误</p>

    <div class="cart-empty" th:if="${#lists.isEmpty(items)}">
        <p>购物车还是空的。</p>
        <p><a th:href="@{/}">去挑几本书</a></p>
    </div>

    <div th:unless="${#lists.isEmpty(items)}">
        <div class="table-wrap">
            <table class="cart-table">
                <thead>
                <tr>
                    <th>商品</th>
                    <th>单价</th>
                    <th>数量</th>
                    <th>小计</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${items}">
                    <td>
                        <strong th:text="${item.name}">书名</strong>
                        <span class="cart-flag" th:if="${!item.active}">已下架</span>
                    </td>
                    <td th:text="|¥${#numbers.formatDecimal(item.priceCents / 100.0, 1, 2)}|">¥0.00</td>
                    <td>
                        <form th:action="@{/cart/update}" method="post" class="cart-qty">
                            <input type="hidden" name="productId" th:value="${item.productId}">
                            <input type="number" name="quantity" th:value="${item.quantity}"
                                   min="1" max="99" required>
                            <button type="submit">更新</button>
                        </form>
                    </td>
                    <td th:text="|¥${#numbers.formatDecimal(item.subtotalCents() / 100.0, 1, 2)}|">¥0.00</td>
                    <td>
                        <form th:action="@{/cart/remove}" method="post" class="cart-remove">
                            <input type="hidden" name="productId" th:value="${item.productId}">
                            <button type="submit">移除</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="cart-total">
            <span>合计</span>
            <strong th:text="|¥${#numbers.formatDecimal(totalCents / 100.0, 1, 2)}|">¥0.00</strong>
        </div>

        <div class="cart-actions">
            <a th:href="@{/}">继续选购</a>
            <a class="checkout-link" th:href="@{/checkout}">去结算</a>
        </div>
    </div>
</main>
</body>
</html>
