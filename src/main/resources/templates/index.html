<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>拾光书店 · 校园图书目录</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<header class="masthead">
    <div class="masthead-inner">
        <a class="brand" th:href="@{/}">
            <span class="brand-seal" aria-hidden="true">书</span>
            <span class="brand-text">拾光书店</span>
        </a>
        <div class="masthead-meta">
            <p class="brand-note">校园图书目录</p>

            <div class="account" sec:authorize="isAnonymous()">
                <a th:href="@{/login}">登录</a>
                <a th:href="@{/register}">注册</a>
            </div>

            <div class="account" sec:authorize="isAuthenticated()">
                <a th:href="@{/cart}">购物车</a>
                <a th:href="@{/orders}">我的订单</a>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/orders}">管理后台</a>
                <span sec:authentication="name">用户</span>
                <form th:action="@{/logout}" method="post">
                    <button type="submit">退出</button>
                </form>
            </div>
        </div>
    </div>
</header>

<div class="search-bar">
    <form class="catalog-search" method="get" th:action="@{/}">
        <input type="hidden" name="category" th:value="${category}">
        <input type="search" name="q" th:value="${q}"
               placeholder="输入书名或描述中的关键词" aria-label="搜索图书">
        <button type="submit">搜索</button>
    </form>
</div>

<div class="flash" th:if="${message != null or error != null}">
    <p class="form-success" th:if="${message}" th:text="${message}">提示</p>
    <p class="form-error" th:if="${error}" th:text="${error}">错误</p>
</div>

<main class="layout">
    <aside class="rail">
        <h2 class="rail-title">分类</h2>
        <nav class="category-list" aria-label="图书分类">
            <a th:href="@{/}" th:classappend="${category == ''} ? 'is-active' : ''">全部</a>
            <a th:each="c : ${categories}"
               th:href="@{/(category=${c})}"
               th:text="${c}"
               th:classappend="${c == category} ? 'is-active' : ''"></a>
        </nav>
    </aside>

    <section class="catalog">
        <div class="catalog-head">
            <p class="result-count">共 <strong th:text="${#lists.size(products)}">0</strong> 种在售</p>
            <p class="query-note" th:if="${q != ''}">关键词：<span th:text="${q}">关键词</span></p>
        </div>

        <div class="book-grid">
            <article class="book-card" th:each="p, iter : ${products}">
                <div class="card-index">
                    <span th:text="${p.category}">分类</span>
                    <span th:text="${#numbers.formatInteger(iter.count, 2)}">01</span>
                </div>
                <h3 class="book-title">
                    <a th:href="@{/product/{id}(id=${p.id})}" th:text="${p.name}">书名</a>
                </h3>
                <p class="book-desc" th:text="${p.description}">简介</p>
                <div class="book-foot">
                    <span class="price"
                          th:text="|¥${#numbers.formatDecimal(p.priceCents / 100.0, 1, 2)}|">¥0.00</span>
                    <span class="stock" th:text="|库存 ${p.stock}|">库存 0</span>
                </div>
                <form sec:authorize="isAuthenticated()" th:action="@{/cart/add}"
                      method="post" class="book-add">
                    <input type="hidden" name="productId" th:value="${p.id}">
                    <button type="submit" th:disabled="${p.stock == 0}"
                            th:text="${p.stock == 0} ? '暂时售罄' : '加入购物车'">加入购物车</button>
                </form>
                <a sec:authorize="isAnonymous()" th:href="@{/login}" class="book-login">登录后购买</a>
            </article>
        </div>

        <p class="empty" th:if="${#lists.isEmpty(products)}">
            没有找到符合条件的商品。换一个关键词，或查看全部分类。
        </p>
    </section>
</main>

<footer class="site-footer">
    <p>拾光书店，网络应用架构课程实验</p>
</footer>
</body>
</html>
