<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>订单管理 · 拾光书店</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<header class="masthead">
    <div class="masthead-inner">
        <a class="brand" th:href="@{/}">
            <span class="brand-seal" aria-hidden="true">书</span>
            <span class="brand-text">拾光书店</span>
        </a>
        <div class="masthead-meta">
            <p class="brand-note">管理后台</p>
            <div class="account" sec:authorize="isAuthenticated()">
                <a th:href="@{/}">返回商城</a>
                <a th:href="@{/admin/products}">商品管理</a>
                <a th:href="@{/admin/orders}">订单管理</a>
                <a th:href="@{/admin/stats}">销售报表</a>
                <span sec:authentication="name">管理员</span>
                <form th:action="@{/logout}" method="post">
                    <button type="submit">退出</button>
                </form>
            </div>
        </div>
    </div>
</header>

<main class="page-shell">
    <h1 class="page-title">订单管理</h1>

    <p class="form-success" th:if="${message}" th:text="${message}">提示</p>
    <p class="form-error" th:if="${error}" th:text="${error}">错误</p>

    <div class="cart-empty" th:if="${#lists.isEmpty(orders)}">
        <p>暂时没有订单。</p>
    </div>

    <article class="order-card" th:each="view : ${orders}">
        <div class="order-head">
            <h2>订单 #<span th:text="${view.order.id}">1</span></h2>
            <span class="status-badge"
                  th:classappend="${'status-' + #strings.toLowerCase(view.order.status.name())}"
                  th:text="${view.order.status.label()}">待付款</span>
        </div>

        <p class="order-meta">
            顾客：<span th:text="${view.customer.name}">姓名</span>
            （<span th:text="${view.customer.email}">邮箱</span>）
        </p>
        <p class="order-meta">
            下单时间：
            <span th:text="${#strings.replace(view.order.createdAt.toString(), 'T', ' ')}">2026-10-20 18:00:00</span>
        </p>
        <p class="order-address">收货信息：<span th:text="${view.order.address}">地址</span></p>
        <p class="order-address" th:if="${view.order.trackingNo != null}">
            物流单号：<span th:text="${view.order.trackingNo}">单号</span>
        </p>

        <div class="table-wrap">
            <table class="cart-table">
                <thead>
                <tr>
                    <th>商品</th>
                    <th>单价</th>
                    <th>数量</th>
                    <th>小计</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${view.order.items}">
                    <td th:text="${item.name}">书名</td>
                    <td th:text="|¥${#numbers.formatDecimal(item.unitPriceCents / 100.0, 1, 2)}|">¥0.00</td>
                    <td th:text="${item.quantity}">1</td>
                    <td th:text="|¥${#numbers.formatDecimal(item.subtotalCents() / 100.0, 1, 2)}|">¥0.00</td>
                </tr>
                </tbody>
            </table>
        </div>

        <p class="order-total">
            订单金额
            <strong th:text="|¥${#numbers.formatDecimal(view.order.totalCents / 100.0, 1, 2)}|">¥0.00</strong>
        </p>

        <form class="ship-form" th:if="${view.order.status.name() == 'PAID'}"
              th:action="@{/admin/orders/ship}" method="post">
            <input type="hidden" name="orderId" th:value="${view.order.id}">
            <label>物流单号
                <input type="text" name="trackingNo" required minlength="3" maxlength="80"
                       placeholder="例如 SF1234567890">
            </label>
            <button type="submit">确认发货</button>
        </form>

        <div class="order-meta" th:if="${view.latestMail != null}">
            发货通知：
            <span th:text="${view.latestMail.statusLabel()}">已发送</span>
            <span th:if="${view.latestMail.error != null}"
                  th:text="|（${view.latestMail.error}）|">（错误）</span>
            <form class="inline-form"
                  th:if="${view.latestMail.status != 'SENT' and view.latestMail.status != 'SENDING'}"
                  th:action="@{/admin/mail/retry}" method="post">
                <input type="hidden" name="mailId" th:value="${view.latestMail.id}">
                <button type="submit">重试邮件</button>
            </form>
        </div>

        <p class="order-meta" th:if="${view.order.status.name() == 'UNPAID'}">
            顾客尚未付款。
        </p>
    </article>
</main>
</body>
</html>
