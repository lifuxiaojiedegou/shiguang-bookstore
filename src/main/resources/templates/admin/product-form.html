<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>商品编辑 · 拾光书店</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<header class="masthead">
    <div class="masthead-inner">
        <a class="brand" th:href="@{/}">
            <span class="brand-seal" aria-hidden="true">书</span>
            <span class="brand-text">拾光书店</span>
        </a>
        <div class="masthead-meta">
            <p class="brand-note">管理后台</p>
            <div class="account" sec:authorize="isAuthenticated()">
                <a th:href="@{/admin/products}">商品管理</a>
                <a th:href="@{/admin/orders}">订单管理</a>
                <a th:href="@{/admin/stats}">销售报表</a>
                <a th:href="@{/admin/logs}">浏览日志</a>
                <form th:action="@{/logout}" method="post">
                    <button type="submit">退出</button>
                </form>
            </div>
        </div>
    </div>
</header>

<main class="page-shell">
    <h1 class="page-title" th:text="${isNew} ? '新增商品' : '编辑商品'">新增商品</h1>

    <form class="admin-form" th:action="@{/admin/products/save}" method="post">
        <input type="hidden" name="id" th:value="${product != null ? product.id : 0}">

        <label>商品名称
            <input type="text" name="name" required maxlength="80"
                   th:value="${product != null ? product.name : ''}">
        </label>

        <label>分类
            <input type="text" name="category" required maxlength="30"
                   th:value="${product != null} ? ${product.category} : ''">
        </label>

        <label>描述
            <textarea name="description" required maxlength="300"
                      th:text="${product != null ? product.description : ''}"></textarea>
        </label>

        <label>价格（元）
            <input type="number" name="price" required min="0.01" max="10000" step="0.01"
                   th:value="${product != null ? #numbers.formatDecimal(product.priceCents / 100.0, 1, 2) : ''}">
        </label>

        <label>库存
            <input type="number" name="stock" required min="0" max="100000"
                   th:value="${product != null ? product.stock : 0}">
        </label>

        <label class="checkbox-row">
            <input type="checkbox" name="active" value="true"
                   th:checked="${product == null or product.active}">
            上架销售
        </label>

        <div class="form-actions">
            <button type="submit">保存</button>
            <a class="secondary-button" th:href="@{/admin/products}">返回列表</a>
        </div>
    </form>
</main>
</body>
</html>
