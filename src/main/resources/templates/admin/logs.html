<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>浏览日志 · 拾光书店</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<header class="masthead">
    <div class="masthead-inner">
        <a class="brand" th:href="@{/}">
            <span class="brand-seal" aria-hidden="true">书</span>
            <span class="brand-text">拾光书店</span>
        </a>
        <div class="masthead-meta">
            <p class="brand-note">管理后台</p>
            <div class="account" sec:authorize="isAuthenticated()">
                <a th:href="@{/}">返回商城</a>
                <a th:href="@{/admin/products}">商品管理</a>
                <a th:href="@{/admin/orders}">订单管理</a>
                <a th:href="@{/admin/stats}">销售报表</a>
                <a th:href="@{/admin/logs}">浏览日志</a>
                <span sec:authentication="name">管理员</span>
                <form th:action="@{/logout}" method="post">
                    <button type="submit">退出</button>
                </form>
            </div>
        </div>
    </div>
</header>

<main class="stats-page">
    <h1 class="page-title">浏览与购买日志</h1>
    <p class="stats-note">记录商品浏览、搜索、加入购物车和下单行为；未登录访客的浏览与搜索同样记录。</p>

    <section class="kpi-row" aria-label="今日行为">
        <div class="stat-tile" th:each="a : ${actions}">
            <span class="stat-label" th:text="|今日${a.label()}|">今日浏览</span>
            <strong class="stat-value" th:text="${today.get(a)}">0</strong>
        </div>
    </section>

    <section class="chart-grid">
        <article class="chart-card">
            <h2>商品转化</h2>
            <p class="chart-note">按浏览次数排序，前 10 件商品。</p>
            <div class="table-wrap">
                <table class="cart-table">
                    <thead>
                    <tr><th>商品</th><th>浏览</th><th>加购</th><th>下单</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="f : ${funnel}">
                        <td th:text="${f.name}">书名</td>
                        <td th:text="${f.views}">0</td>
                        <td th:text="${f.carts}">0</td>
                        <td th:text="${f.orders}">0</td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <p class="chart-empty" th:if="${#lists.isEmpty(funnel)}">暂无商品行为记录。</p>
        </article>

        <article class="chart-card">
            <h2>热门搜索词</h2>
            <p class="chart-note">按搜索次数排序，前 10 个关键词。</p>
            <div class="table-wrap">
                <table class="cart-table">
                    <thead>
                    <tr><th>关键词</th><th>次数</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="k : ${keywords}">
                        <td th:text="${k.keyword}">关键词</td>
                        <td th:text="${k.count}">0</td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <p class="chart-empty" th:if="${#lists.isEmpty(keywords)}">暂无搜索记录。</p>
        </article>
    </section>

    <nav class="log-filter" aria-label="按行为筛选">
        <a th:href="@{/admin/logs}" th:classappend="${action == ''} ? 'is-active' : ''">全部</a>
        <a th:each="a : ${actions}"
           th:href="@{/admin/logs(action=${a.name()})}"
           th:text="${a.label()}"
           th:classappend="${a.name() == action} ? 'is-active' : ''">浏览</a>
    </nav>

    <div class="table-wrap">
        <table class="cart-table">
            <thead>
            <tr>
                <th>时间</th>
                <th>行为</th>
                <th>用户</th>
                <th>商品</th>
                <th>详情</th>
                <th>IP</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="l : ${logs}">
                <td class="log-time"
                    th:text="${#strings.replace(l.createdAt.toString(), 'T', ' ')}">2026-10-29 18:00:00</td>
                <td th:text="${l.action.label()}">浏览</td>
                <td th:text="${l.userEmail != null} ? ${l.userEmail} : '访客'">访客</td>
                <td th:text="${l.productName != null} ? ${l.productName} : '—'">书名</td>
                <td th:text="${l.detail != null} ? ${l.detail} : '—'">—</td>
                <td th:text="${l.ip}">127.0.0.1</td>
            </tr>
            </tbody>
        </table>
    </div>
    <p class="chart-empty" th:if="${#lists.isEmpty(logs)}">暂无日志。</p>
    <p class="stats-note" th:unless="${#lists.isEmpty(logs)}">仅显示最近 100 条。</p>
</main>
</body>
</html>
